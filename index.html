<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>🍿 PopcornPick</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <div class="logo">
    <div class="title">🍿 PopcornPick</div>
    <div>- Lights.Camera.POPcorn</div>
  </div>

  <nav class="nav">
    <a href="#/movies" class="active">Movies</a>
    <a href="#/shows">TV Shows</a>
    <a href="#/watchlist">Watchlist</a>

    <!-- GENRE -->
    <select id="genreFilter" class="navPill">
      <option value="">All Genres</option>
      <option value="28">Action</option>
      <option value="35">Comedy</option>
      <option value="18">Drama</option>
      <option value="53">Thriller</option>
      <option value="10749">Romance</option>
      <option value="27">Horror</option>
      <option value="878">Sci-Fi</option>
    </select>

    <!-- RATING -->
    <select id="ratingFilter" class="navPill">
      <option value="">Any Rating</option>
      <option value="6">⭐ 6+</option>
      <option value="7">⭐ 7+</option>
      <option value="8">⭐ 8+</option>
    </select>

    <!-- LANGUAGE -->
    <select id="languageFilter" class="navPill">
      <option value="">All Languages</option>
      <option value="hi">Hindi</option>
      <option value="ta">Tamil</option>
      <option value="te">Telugu</option>
      <option value="kn">Kannada</option>
      <option value="ml">Malayalam</option>
      <option value="en">English</option>
    </select>

    <!-- MOOD -->
    <select id="moodFilter" class="navPill">
      <option value="">Any Mood</option>
      <option value="feelgood">😊 Feel Good</option>
      <option value="thriller">😱 Thriller</option>
      <option value="romantic">❤️ Romantic</option>
      <option value="family">👨‍👩‍👧 Family</option>
    </select>
  </nav>

  <div class="controls">
    <input id="searchBox" class="input" placeholder="Search..." />
    <button id="loginBtn" class="cta">Sign In</button>

    <div id="userArea" class="userBadge" style="display:none">
      <img src="https://picsum.photos/seed/user/40">
      <span id="userName"></span>
      <button class="cta small" onclick="logout()">Logout</button>
    </div>
  </div>
</header>

<main id="app">

  <!-- TRENDING -->
  <section class="homeSection">
    <h2 class="sectionTitle">🔥 Trending Today</h2>
    <div class="row" id="trendingRow"></div>
  </section>

  <!-- CONTINUE WATCHING -->
  <section class="homeSection">
    <h2 class="sectionTitle">🕒 Continue Watching</h2>
    <div class="row" id="continueRow"></div>
  </section>

  <!-- RECOMMENDED -->
  <section class="homeSection">
    <h2 class="sectionTitle">🎯 Recommended For You</h2>
    <div class="row" id="recommendedRow"></div>
  </section>

  <!-- ALL MOVIES / SHOWS -->
  <section class="homeSection">
    <h2 class="sectionTitle">🎬 Browse All</h2>
    <div class="grid"></div>
  </section>

</main>

<!-- AUTH -->
<div id="authModal" class="modal">
  <div class="box">
    <h2 id="authTitle">Login</h2>
    <input id="nameInput" placeholder="Name" style="display:none">
    <input id="emailInput" placeholder="Email">
    <input id="passwordInput" type="password" placeholder="Password">
    <button class="cta" onclick="submitAuth()">Submit</button>
    <p>New user? <span class="link" onclick="switchAuth()">Create account</span></p>
  </div>
</div>

<div id="infoOverlay"></div>

<script src="script.js"></script>
</body>
</html>
